<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaWordle</title>
    <style>
        body { background-color: #121213; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; min-height: 100vh; }
        header { font-size: 32px; font-weight: bold; margin-bottom: 5px; text-transform: none; letter-spacing: 2px; }
        .subtitle { color: #818384; margin: 0 0 20px 0; font-size: 14px; text-align: center; }
        #board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin-bottom: 20px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 52px; height: 52px; border: 2px solid #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; text-transform: uppercase; box-sizing: border-box; }
        
        .tile.correct, .key.correct { background-color: #538d4e !important; border-color: #538d4e !important; color: white; }
        .tile.present, .key.present { background-color: #b59f3b !important; border-color: #b59f3b !important; color: white; }
        .tile.absent, .key.absent { background-color: #3a3a3c !important; border-color: #3a3a3c !important; color: white; }
        
        #keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: 500px; width: 100%; padding: 0 10px; box-sizing: border-box; }
        .key-row { display: flex; gap: 4px; width: 100%; justify-content: center; }
        .key { background-color: #818384; color: white; border: none; border-radius: 4px; height: 50px; flex: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; transition: background-color 0.2s; }
        .key.wide { flex: 1.5; }
        .message { height: 24px; font-weight: bold; color: #ff3333; margin-bottom: 15px; font-size: 16px; text-align: center; }
        .reset-btn { background-color: #538d4e; color: white; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 15px; margin-top: 20px; }
        .reset-btn:hover { background-color: #43733f; }
    </style>
</head>

        ];

        let targetWord = "";

        let attempts = 0;
        let gameOver = false;

        const maxAttempts = 6;
        const wordLength = 5;

        function initGame() {
            if (!dictionary || dictionary.length === 0) {
                showMessage("Словарь пуст! Добавьте слова в массив dictionary.");
                return;
            }
            targetWord = dictionary[Math.floor(Math.random() * dictionary.length)].toUpperCase();
            currentGuess = "";
            attempts = 0;
            gameOver = false;
            document.getElementById("message").innerText = "";

            const board = document.getElementById("board");
            board.innerHTML = "";
            for (let i = 0; i < maxAttempts; i++) {
                const row = document.createElement("div");
                row.className = "row";
                row.id = `row-${i}`;
                for (let j = 0; j < wordLength; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }

            const keyboard = document.getElementById("keyboard");
            keyboard.innerHTML = "";
            keyboardLayout.forEach(rowLayout => {
                const row = document.createElement("div");
                row.className = "key-row";
                rowLayout.forEach(keyText => {
                    const btn = document.createElement("button");
                    btn.className = "key";
                    btn.id = `key-${keyText}`;
                    if (keyText === "ENTER" || keyText === "BACKSPACE") {
                        btn.classList.add("wide");
                        btn.innerText = keyText === "BACKSPACE" ? "⌫" : "ENTER";
                    } else {
                        btn.innerText = keyText;
                    }
                    btn.addEventListener("click", () => handleKeyPress(keyText));
                    row.appendChild(btn);
                });
                keyboard.appendChild(row);
            });
        }

        function updateBoard() {
            for (let j = 0; j < wordLength; j++) {
                const tile = document.getElementById(`tile-${attempts}-${j}`);
                if (j < currentGuess.length) {
                    tile.innerText = currentGuess[j];
                } else {
                    tile.innerText = "";
                }
            }
        }

        function handleKeyPress(key) {
            if (gameOver) return;

            if (key === "BACKSPACE") {
                if (currentGuess.length > 0) {
                    currentGuess = currentGuess.slice(0, -1);
                    updateBoard();
                }
                document.getElementById("message").innerText = "";
            } else if (key === "ENTER") {
                if (currentGuess.length === wordLength) {
                    checkGuess();
                } else {
                    showMessage("Слишком короткое слово!");
                }
            } else {
                if (currentGuess.length < wordLength && /^[А-ЯЁ]$/i.test(key)) {
                    currentGuess += key.toUpperCase();
                    updateBoard();
                }
            }
        }

        function showMessage(msg) {
            document.getElementById("message").innerText = msg;
        }

        function checkGuess() {
            if (!dictionary.includes(currentGuess)) {
                showMessage("Такого слова нет в словаре!");
                return;
            }

            const targetLetters = targetWord.split("");
            const guessLetters = currentGuess.split("");
            const tileStatuses = Array(wordLength).fill("absent");

            for (let i = 0; i < wordLength; i++) {
                if (guessLetters[i] === targetLetters[i]) {
                    tileStatuses[i] = "correct";
                    targetLetters[i] = null; 
                    guessLetters[i] = null; 
                }
            }

            for (let i = 0; i < wordLength; i++) {
                if (guessLetters[i] === null) continue;
                const index = targetLetters.indexOf(guessLetters[i]);
                if (index !== -1) {
                    tileStatuses[i] = "present";
                    targetLetters[index] = null;
                }
            }

            for (let i = 0; i < wordLength; i++) {
                const tile = document.getElementById(`tile-${attempts}-${i}`);
                const status = tileStatuses[i];
                tile.classList.add(status);

                const originalLetter = currentGuess[i];
                const keyBtn = document.getElementById(`key-${originalLetter}`);
                
                if (keyBtn) {
                    if (status === "correct") {
                        keyBtn.classList.remove("present", "absent");
                        keyBtn.classList.add("correct");
                    } else if (status === "present") {
                        if (!keyBtn.classList.contains("correct")) {
                            keyBtn.classList.remove("absent");
                            keyBtn.classList.add("present");
                        }
                    } else if (status === "absent") {
                        if (!keyBtn.classList.contains("correct") && !keyBtn.classList.contains("present")) {
                            keyBtn.classList.add("absent");
                        }
                    }
                }
            }

            if (currentGuess === targetWord) {
                showMessage("Вы победили! 🎉");
                gameOver = true;
                return;
            }

            attempts++;
            currentGuess = "";

            if (attempts >= maxAttempts) {
                showMessage(`Вы проиграли! Было загадано слово: ${targetWord}`);
                gameOver = true;
            }
        }

        window.addEventListener("keydown", (e) => {
            let key = e.key.toUpperCase();
            if (key === "ENTER") {
                handleKeyPress("ENTER");
            } else if (key === "BACKSPACE") {
                handleKeyPress("BACKSPACE");
            } else {
                if (key === "Ё") key = "Е"; 
                if (/^[А-Я]$/.test(key)) {
                    handleKeyPress(key);
                }
            }
        });

        initGame();
    </script>
